# PedidoPro — stack local para rodar na rede (LAN), multiplataforma (Zorin/Windows).
#
#   docker compose up -d --build      # sobe app + banco
#   docker compose exec app php /var/www/html/api/config/seed.php   # cria admin inicial
#
# Acesso: http://127.0.0.1:${APP_PORT:-8090}  (ou http://IP-do-servidor:PORTA na LAN)

# Nome fixo do projeto: o stack é o mesmo independentemente da pasta de onde se roda
# (ex.: rodar a partir do worktree D:\pedidos-erp).
name: pedidopro-erp

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      # Fuso local: NOW()/TIMESTAMP saem no horário do restaurante (timers do PDV dependem disso).
      TZ: ${TZ:-America/Sao_Paulo}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-root_pedidopro}
      MYSQL_DATABASE: ${DB_NAME:-pedidopro}
      MYSQL_USER: ${DB_USER:-pedidopro}
      MYSQL_PASSWORD: ${DB_PASS:-pedidopro}
    volumes:
      - db_data:/var/lib/mysql
      - ./backend-php/config:/opt/dbsrc:ro          # schema + migrations (fonte do init)
      - ./docker/db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT_HOST:-3307}:3306"                # opcional: inspecionar o banco de fora
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_ROOT_PASS:-root_pedidopro}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: pedidopro-erp-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment: &app-env
      TZ: ${TZ:-America/Sao_Paulo}
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME:-pedidopro}
      DB_USER: ${DB_USER:-pedidopro}
      DB_PASS: ${DB_PASS:-pedidopro}
      # Em produção (APP_ENV=production) o backend RECUSA o secret default abaixo:
      # defina JWT_SECRET (e senhas do banco) num .env ao lado deste arquivo.
      JWT_SECRET: ${JWT_SECRET:-troque-esta-chave-por-uma-bem-grande-0123456789}
      JWT_EXPIRES_DAYS: "7"
      APP_ENV: ${APP_ENV:-dev}
      # Sem internet no bootstrap: não chamar plataformas externas (iFood/99Food).
      INTEGRATIONS_MOCK: ${INTEGRATIONS_MOCK:-1}
      # Rede de segurança: conclui localmente pedidos 'dispatched' há >N min (0 = off).
      # iFood de entrega própria nem sempre emite CONCLUDED — sem isso o pedido fica
      # preso em 'A caminho' (e como 'Pronto' no painel de Vendas).
      DELIVERY_AUTO_CONCLUDE_MIN: ${DELIVERY_AUTO_CONCLUDE_MIN:-0}
      CORS_ORIGINS: ""
      # Assinatura da impressão QZ Tray (PEM em base64 no .env ao lado; vazio = modo
      # não-assinado, o QZ pede "Permitir" no PC do painel).
      QZ_CERT_B64: ${QZ_CERT_B64:-}
      QZ_PRIVATE_KEY_B64: ${QZ_PRIVATE_KEY_B64:-}
    ports:
      # 8090 por padrão: a 8080 costuma estar ocupada pela Evolution API (WhatsApp) neste PC.
      - "${APP_PORT:-8090}:80"

  # Poller das plataformas de delivery (substitui o cron do HostGator):
  # iFood opera por POLLING; para o 99Food o loop também reconcilia estado
  # (callback perdido não deixa pedido preso). Sem canais ativos (ou com
  # INTEGRATIONS_MOCK=1) o loop é inofensivo — não chama nada externo.
  poller:
    image: pedidopro-erp-app
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
    environment: *app-env
    # O entrypoint padrão da imagem roda migrations+Apache; aqui só o loop de poll
    # (as migrations ficam a cargo do serviço `app`).
    entrypoint: ["php", "/var/www/html/api/bin/poll.php", "--loop"]
    # O healthcheck da imagem testa o Apache na :80 — não se aplica ao loop de CLI.
    healthcheck:
      disable: true

volumes:
  db_data:
